services:
  - type: web
    name: gabriel-whatsapp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001
      - key: GOOGLE_CALENDAR_ICS_URL
        sync: false
      - key: PASTOR_WHATSAPP_NUMBER
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: STAFF_WHATSAPP_NUMBER
        sync: false
      - key: ESCALAS_DATABASE_URL
        sync: false
